# Temporary: checks which MakerWorld URLs are reachable from GitHub's runners.
name: Probe MakerWorld access
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install curl_cffi
      - shell: python
        run: |
          from curl_cffi import requests as r
          urls = [
              "https://makerworld.com/en/@Sams3DSolutions/upload",
              "https://makerworld.com/en/models/2718844-thread-cone-adapter-for-sewing-machines-25g",
              "https://makerworld.com/api/v1/design-service/published/724349580/design?offset=0&limit=20",
              "https://makerworld.com/api/v1/design-service/design/2718844",
              "https://api.bambulab.com/v1/design-service/published/724349580/design?offset=0&limit=20",
              "https://r.jina.ai/https://makerworld.com/en/@Sams3DSolutions/upload",
          ]
          for u in urls:
              for imp in ("chrome", "safari"):
                  try:
                      resp = r.get(u, impersonate=imp, timeout=30)
                      body = resp.text[:400].replace("\n", " ").replace("%", "%25")
                      print(f"::notice title={resp.status_code} {imp}::{u} | {len(resp.text)} chars | {body}")
                  except Exception as e:
                      print(f"::notice title=ERR {imp}::{u} | {e!r}")
