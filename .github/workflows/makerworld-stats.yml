# Refreshes stats.json with the latest MakerWorld numbers once a day.
# Can also be run by hand from the repo's Actions tab ("Run workflow").
name: Update MakerWorld stats

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write          # needed to commit stats.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # curl_cffi imitates a real browser, which bot protection is less
      # likely to block.
      - name: Install dependencies
        run: pip install curl_cffi

      - name: Fetch stats
        run: python scripts/update_makerworld_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- stats.json && git ls-files --error-unmatch stats.json >/dev/null 2>&1; then
            echo "stats.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "Update MakerWorld stats"
          git push
